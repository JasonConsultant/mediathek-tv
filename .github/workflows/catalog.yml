name: Katalog aktualisieren

# Baut täglich den Katalog aus der MediathekView-Filmliste und legt ihn im Branch "catalog" ab.
# Die App lädt ihn von dort (raw.githubusercontent.com).
on:
  schedule:
    - cron: "17 4 * * *"      # täglich ca. 05:17/06:17 Uhr (MEZ/MESZ)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build_catalog.py", ".github/workflows/catalog.yml"]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install scikit-learn==1.9.1
      - name: Katalog bauen
        run: python3 tools/build_catalog.py --out out
      - name: Im Branch "catalog" veröffentlichen
        run: |
          cd out
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Katalog $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog

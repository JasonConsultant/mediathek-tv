name: Build, Test & Release

# Jede Änderung an der App: bauen, Unit-Tests, Geräte-Test auf einem Android-TV-Emulator.
# Veröffentlicht (neue Version für die App) wird NUR auf Knopfdruck ("Run workflow" mit release = true)
# und NUR, wenn alle Tests bestanden sind.
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradle/**", "gradlew", "gradlew.bat", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Nach bestandenen Tests als neue Version veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Build und Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests und Release-Build (Prüfung inkl. R8 und Lint)
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

  device:
    name: Geräte-Test (Android-TV-Emulator, Android 12)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: KVM einschalten (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test-APKs bauen
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Emulator starten und App mit Fernbedienungstasten testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || (adb logcat -d > logcat.txt; adb pull /data/local/tmp/ screens/ || true; exit 1)
      - name: Testbericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geraete-test
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            screens/
          if-no-files-found: ignore

  release:
    name: Veröffentlichen
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test, device]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signierschlüssel aus den Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Signierte Release-APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MediathekTV.apk
      - name: Release-Notizen (Änderungen seit der letzten Version)
        run: |
          git fetch --tags -q || true
          last=$(git tag --list 'v2-*' --sort=-v:refname | head -1)
          {
            echo "## Änderungen"
            if [ -n "$last" ]; then git log "$last"..HEAD --format='- %s' -- app; else git log -1 --format='- %s'; fi
            echo
            echo "Geprüft: Unit-Tests und Geräte-Test auf Android-TV-Emulator (Android 12) bestanden."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-${{ github.run_number }}
          name: Mediathek TV 2.${{ github.run_number }}
          body_path: notes.md
          files: MediathekTV.apk

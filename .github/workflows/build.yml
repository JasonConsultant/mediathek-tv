name: Build & Release APK

on:
  push:
    branches: [main]
    # Nur bei Änderungen an der App – Katalog-Änderungen erzeugen keine neue App-Version
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MediathekTV.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mediathek TV 1.${{ github.run_number }}
          body: "Automatischer Build von Commit ${{ github.sha }}"
          files: MediathekTV.apk
